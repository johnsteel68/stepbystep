map $http_origin $deck_cors_origin {
    default "";
    "https://step-generator.yop39.chatgpt.site" $http_origin;
    "https://stepbystep.john-steel.com" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Same-origin relay to John Steel's uploader. The exact location and
    # origin allowlist prevent this endpoint from becoming a general proxy.
    location = /api/deck/upload {
        if ($deck_cors_origin = "") {
            return 403;
        }
        if ($request_method = OPTIONS) {
            return 204;
        }
        if ($request_method != POST) {
            return 405;
        }

        client_max_body_size 20m;
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $john_steel_host www.john-steel.com;
        proxy_pass https://$john_steel_host/fr/module/johnsteel_uploader/upload;
        proxy_http_version 1.1;
        proxy_set_header Host www.john-steel.com;
        # Caddy supplies the relay's hostname; Prestashop otherwise redirects
        # the upload request to the shop homepage instead of returning JSON.
        proxy_set_header X-Forwarded-Host www.john-steel.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.john-steel.com;
        proxy_set_header Origin https://stepbystep.john-steel.com;
        proxy_set_header Referer https://stepbystep.john-steel.com/;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin $deck_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary "Origin" always;
    }

    location ~* "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
